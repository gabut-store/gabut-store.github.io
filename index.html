<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orang Gabut</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #667eea, #764ba2, #6dd5ed, #2193b0);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
      color: white;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.7);
      object-fit: cover;
      margin-bottom: 15px;
      transition: 0.4s;
    }

    .profile-img:hover {
      transform: scale(1.08) rotate(3deg);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .bio {
      font-size: 14px;
      opacity: 0.9;
      margin: 8px 0 25px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255,255,255,0.9);
      color: #333;
      text-decoration: none;
      padding: 13px;
      margin: 10px 0;
      border-radius: 14px;
      font-weight: 600;
      transition: 0.25s;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .link:hover {
      transform: translateY(-3px) scale(1.03);
      background: white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="cewek.jpeg" class="profile-img" alt="Foto Profil">

    <h1>Karya Anak Bangsa</h1>
    <div class="bio">Semua kegabutan gw ada di sini</div>

    <a href="https://gabut-store.github.io/toko-online/" class="link" target="_blank">Toko Online</a>
    <a href="https://gabut-store.github.io/kuis-perkalian/" class="link" target="_blank">Kuis Perkalian</a>
    <a href="https://gabut-store.github.io/formulir-laporan/" class="link" target="_blank">Formulir Laporan</a>
    <a href="https://gabut-store.github.io/pengaduan-sarana-sekolah/" class="link" target="_blank">Pengaduan Sarana Sekolah</a>
    <a href="https://gabut-store.github.io/tictactoe/" class="link" target="_blank">Tic Tac Toe</a>
    
    <div class="footer">Made in Indonesia</div>
  </div>

</body>
</html>
